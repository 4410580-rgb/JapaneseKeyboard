name: Clear Keyboard APK

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clear-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZENZ_MODEL_CACHE_DIR: ${{ github.workspace }}/.zenz-model-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-clear-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-clear-gradle-
            ${{ runner.os }}-gradle-

      - name: Cache Zenz model
        uses: actions/cache@v4
        with:
          path: .zenz-model-cache
          key: ${{ runner.os }}-zenz-model-v2-4f5423f0fad41a73b1242eb96fe5c12ae4fdca83-Q5_K_M-ggml-model-Q5_K_M.gguf

      # 追加の語彙: Mozc UT 辞書（約260万語）をアプリの「システムユーザー辞書」の形式にして APK に入れる。
      # 作るのに時間がかかるので、作り方が変わらない限りキャッシュを使う
      - name: Cache UT dictionary
        id: ut-cache
        uses: actions/cache@v4
        with:
          path: .clear-ut/out
          key: clear-ut-v1-${{ hashFiles('tools/clear-ut-dictionary/**', 'app/src/test/java/com/kazumaproject/markdownhelperkeyboard/converter/ClearUtDictionaryGenerator.kt', 'app/src/main/assets/id.def') }}

      - name: Build UT dictionary
        if: steps.ut-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/clear-ut-dictionary/build_ut.py .clear-ut app/src/main/assets/id.def
          CLEAR_UT_TSV=$PWD/.clear-ut/ut.tsv CLEAR_UT_OUT=$PWD/.clear-ut/out \
            ./gradlew :app:testFullStandardDebugUnitTest \
            --tests 'com.kazumaproject.markdownhelperkeyboard.converter.ClearUtDictionaryGenerator' \
            -PzenzDebugOptimizedNative=true \
            --stacktrace --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs=-Xmx3g -i 2>&1 | tee build.log | grep --line-buffered -E 'entries=|Nodes=|たいけん|FAILED|Exception|^e: |BUILD'
          ls -la .clear-ut/out
          test -f .clear-ut/out/token_system_user_dictionary.dat

      - name: Put UT dictionary into assets
        shell: bash
        run: |
          mkdir -p app/src/full/assets/clear_ut
          cp .clear-ut/out/*.dat .clear-ut/out/version.txt app/src/full/assets/clear_ut/
          ls -la app/src/full/assets/clear_ut

      # AI 変換（zenz）入りの full 版。ネイティブ部分は最適化してビルドする（デバッグのままだと変換が遅い）
      - name: Build APK
        run: >-
          ./gradlew :app:assembleFullStandardDebug
          -PzenzDebugOptimizedNative=true
          --stacktrace --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx3g
          2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |error:|FAILURE|What went wrong|AssertionError|OutOfMemoryError|IllegalStateException' -A2 build.log | head -40 > errs.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errs.txt)
          echo "::error title=build::${msg}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clear-keyboard-apk
          path: app/build/outputs/apk/fullStandard/debug/*.apk

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          APK=$(ls app/build/outputs/apk/fullStandard/debug/*.apk | head -1)
          cp "$APK" clear-keyboard.apk
          gh release view latest-clear >/dev/null 2>&1 || gh release create latest-clear --title "透過キーボード 最新版" --notes "dev ブランチの最新ビルド"
          gh release upload latest-clear clear-keyboard.apk --clobber
          gh release edit latest-clear --notes "dev ブランチの最新ビルド（${GITHUB_SHA::7}）"
